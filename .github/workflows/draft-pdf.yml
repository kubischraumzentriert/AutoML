name: Draft JOSS PDF

# Baut bei jeder Aenderung an joss/paper.md oder joss/paper.bib eine
# unverbindliche Vorschau-PDF im JOSS-Layout (via openjournals/inara,
# selbes Tool, das JOSS auch fuer den echten Review nutzt) - reine
# Formatierungs-/Zitations-Pruefung, KEINE Einreichung. Siehe
# joss/README.md fuer den vollen Einreichungs-Ablauf.

on:
  push:
    branches: [main]
    paths: ["joss/paper.md", "joss/paper.bib", ".github/workflows/draft-pdf.yml"]
  pull_request:
    paths: ["joss/paper.md", "joss/paper.bib", ".github/workflows/draft-pdf.yml"]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: joss/paper.md

      - name: Upload PDF als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: joss/paper.pdf
